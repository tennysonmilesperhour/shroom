name: Sheet import

# Live sync of the Master Cultivation Reference .xlsx (the single source of
# truth) into the Supabase the web app reads. Runs on a schedule and on demand.
#
# Required repository secrets:
#   GOOGLE_OAUTH_TOKEN          - OAuth access token with Drive read scope
#   SUPABASE_URL                - https://<ref>.supabase.co
#   SUPABASE_SERVICE_ROLE_KEY   - service-role key (bypasses RLS; keep secret)
# Optional:
#   MASTER_SHEET_FILE_ID        - overrides the default Drive file id

on:
  schedule:
    - cron: "0 7 * * *" # daily 07:00 UTC
  workflow_dispatch:
    inputs:
      target:
        description: "Import target"
        type: choice
        default: supabase
        options: [supabase, sqlite, both]

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Import sheet
        env:
          GOOGLE_OAUTH_TOKEN: ${{ secrets.GOOGLE_OAUTH_TOKEN }}
          MASTER_SHEET_FILE_ID: ${{ secrets.MASTER_SHEET_FILE_ID }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python -m backend.app.sheet.importer \
            --target "${{ github.event.inputs.target || 'supabase' }}"
